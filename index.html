<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDT</title>
<style>
  body { font-family: Arial, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 16px; }
  h1 { margin-top: 0; }
  nav button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; padding: 10px 16px; margin-right: 6px; border-radius: 6px; cursor: pointer; }
  nav button.aktiv { background: #1f6feb; }
  .tartalom { margin: 70px 0 0 120px; font-size: 20px; }
  @media (max-width: 700px) { .tartalom { margin: 40px 0 0 16px; font-size: 18px; } }
  section { display: none; }
  section.aktiv { display: block; }
  h2 { font-size: 28px; }
  h2.lista { margin-top: 50px; }
  input, select, textarea { font-size: 18px; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin: 6px 6px 6px 0; max-width: 100%; }
  textarea { width: 100%; box-sizing: border-box; min-height: 120px; }
  .gomb, .torol { color: #fff; border: 0; padding: 12px 20px; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 6px; }
  .gomb { background: #238636; }
  .torol { background: #da3633; }
  .kartya { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; margin: 10px 0; }
  .fejlec { display: flex; justify-content: space-between; gap: 12px; }
  .ido { color: #8b949e; font-size: 16px; }
  .szolgalat { color: #3fb950; font-weight: bold; }
  .nincs { color: #8b949e; }
  .en { color: #58a6ff; font-size: 16px; }
  .hiba { color: #ff7b72; }
</style>
</head>
<body>
<h1>Rendőrségi MDT</h1>
<nav>
  <button id="b-rendorok" class="aktiv" onclick="valt('rendorok')">Rendőrök</button>
  <button id="b-jelentesek" onclick="valt('jelentesek')">Jelentések</button>
</nav>

<div class="tartalom">

<div id="hiba" class="hiba"></div>

<section id="rendorok" class="aktiv">
  <div id="ujRendor">
    <h2>Új rendőr</h2>
    <input id="nev" placeholder="Név">
    <input id="jelveny" placeholder="Jelvényszám">
    <input id="rang" placeholder="Rang">
    <button class="gomb" onclick="rendorHozzaad()">Hozzáadás</button>
  </div>
  <h2 class="lista">Lista</h2>
  <div id="rendorLista"></div>
</section>

<section id="jelentesek">
  <h2>Új jelentés</h2>
  <select id="jSzerzo"></select>
  <input id="jCim" placeholder="Cím">
  <textarea id="jSzoveg" placeholder="Jelentés szövege"></textarea>
  <button class="gomb" onclick="jelentesHozzaad()">Mentés</button>
  <h2 class="lista">Jelentések</h2>
  <div id="jelentesLista"></div>
</section>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDMJ6HopderUazNc2ABDDrrYyFpYX6h9bY",
    authDomain: "mdt0-c07d4.firebaseapp.com",
    projectId: "mdt0-c07d4",
    storageBucket: "mdt0-c07d4.firebasestorage.app",
    messagingSenderId: "760990096469",
    appId: "1:760990096469:web:6dd44b8950078bd09d88dc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let rendorok = [];
  let jelentesek = [];
  let rendorokBetoltve = false;
  let sajatId = null;
  try { sajatId = localStorage.getItem('mdt_sajat_id'); } catch (e) {}

  function szoveg(s) {
    const d = document.createElement('div');
    d.textContent = (s === undefined || s === null) ? '' : s;
    return d.innerHTML;
  }
  function hibaKiir(uzenet) {
    document.getElementById('hiba').textContent = uzenet;
  }

  window.valt = function (nev) {
    ['rendorok', 'jelentesek'].forEach(function (n) {
      document.getElementById(n).classList.toggle('aktiv', n === nev);
      document.getElementById('b-' + n).classList.toggle('aktiv', n === nev);
    });
  };

  window.rendorHozzaad = async function () {
    const nev = document.getElementById('nev').value.trim();
    const jelveny = document.getElementById('jelveny').value.trim();
    const rang = document.getElementById('rang').value.trim();
    if (!nev) return;
    try {
      const ref = await addDoc(collection(db, 'rendorok'), {
        nev: nev, jelveny: jelveny, rang: rang, szolgalatban: false, letrehozva: Date.now()
      });
      sajatId = ref.id;
      try { localStorage.setItem('mdt_sajat_id', sajatId); } catch (e) {}
      document.getElementById('nev').value = '';
      document.getElementById('jelveny').value = '';
      document.getElementById('rang').value = '';
      hibaKiir('');
      rajzol();
    } catch (e) {
      hibaKiir('Nem sikerült menteni a rendőrt: ' + e.message);
    }
  };

  window.szolgalatValt = async function (id) {
    const r = rendorok.find(function (x) { return x.id === id; });
    if (!r) return;
    try {
      await updateDoc(doc(db, 'rendorok', id), { szolgalatban: !r.szolgalatban });
    } catch (e) {
      hibaKiir('Nem sikerült módosítani: ' + e.message);
    }
  };

  window.rendorTorol = async function (id) {
    try {
      await deleteDoc(doc(db, 'rendorok', id));
    } catch (e) {
      hibaKiir('Nem sikerült törölni: ' + e.message);
    }
  };

  window.jelentesHozzaad = async function () {
    const szerzo = document.getElementById('jSzerzo').value;
    const cim = document.getElementById('jCim').value.trim();
    const tartalom = document.getElementById('jSzoveg').value.trim();
    if (!szerzo) { hibaKiir('Jelentés írásához előbb vegyél fel egy rendőrt.'); return; }
    if (!cim || !tartalom) return;
    try {
      await addDoc(collection(db, 'jelentesek'), {
        szerzo: szerzo, cim: cim, tartalom: tartalom, ido: Date.now()
      });
      document.getElementById('jCim').value = '';
      document.getElementById('jSzoveg').value = '';
      hibaKiir('');
    } catch (e) {
      hibaKiir('Nem sikerült menteni a jelentést: ' + e.message);
    }
  };

  window.jelentesTorol = async function (id) {
    try {
      await deleteDoc(doc(db, 'jelentesek', id));
    } catch (e) {
      hibaKiir('Nem sikerült törölni: ' + e.message);
    }
  };

  function rajzol() {
    // Ha a saját rendőr törölve lett, újra megjelenik az űrlap
    if (rendorokBetoltve && sajatId && !rendorok.some(function (r) { return r.id === sajatId; })) {
      sajatId = null;
      try { localStorage.removeItem('mdt_sajat_id'); } catch (e) {}
    }
    document.getElementById('ujRendor').style.display = sajatId ? 'none' : 'block';

    document.getElementById('rendorLista').innerHTML = rendorok.map(function (r) {
      return '<div class="kartya"><b>' + szoveg(r.nev) + '</b>' +
        (r.id === sajatId ? ' <span class="en">(te)</span>' : '') +
        ' | Jelvény: ' + szoveg(r.jelveny) +
        ' | Rang: ' + szoveg(r.rang) + ' | ' +
        (r.szolgalatban ? '<span class="szolgalat">Szolgálatban</span>' : '<span class="nincs">Nincs szolgálatban</span>') +
        '<br><button class="gomb" onclick="szolgalatValt(\'' + r.id + '\')">Szolgálat be/ki</button> ' +
        '<button class="torol" onclick="rendorTorol(\'' + r.id + '\')">Törlés</button></div>';
    }).join('') || '<p class="nincs">Még nincs rendőr.</p>';

    const select = document.getElementById('jSzerzo');
    const elozo = select.value;
    select.innerHTML = rendorok.map(function (r) {
      const kivalasztva = elozo ? (r.nev === elozo) : (r.id === sajatId);
      return '<option' + (kivalasztva ? ' selected' : '') + '>' + szoveg(r.nev) + '</option>';
    }).join('');

    document.getElementById('jelentesLista').innerHTML = jelentesek.map(function (j) {
      return '<div class="kartya"><div class="fejlec"><b>' + szoveg(j.cim) + '</b>' +
        '<span class="ido">' + szoveg(new Date(j.ido).toLocaleString('hu-HU')) + '</span></div>' +
        '<small>' + szoveg(j.szerzo) + '</small><p>' + szoveg(j.tartalom) + '</p>' +
        '<button class="torol" onclick="jelentesTorol(\'' + j.id + '\')">Törlés</button></div>';
    }).join('') || '<p class="nincs">Még nincs jelentés.</p>';
  }

  onSnapshot(query(collection(db, 'rendorok'), orderBy('letrehozva')), function (snap) {
    rendorok = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    rendorokBetoltve = true;
    hibaKiir('');
    rajzol();
  }, function (e) {
    hibaKiir('Nem sikerült betölteni a rendőröket: ' + e.message);
  });

  onSnapshot(query(collection(db, 'jelentesek'), orderBy('ido', 'desc')), function (snap) {
    jelentesek = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    rajzol();
  }, function (e) {
    hibaKiir('Nem sikerült betölteni a jelentéseket: ' + e.message);
  });

  rajzol();
</script>
</body>
</html>
